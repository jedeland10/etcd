<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raft Cluster Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root {
    --bg-deep: #0a0e1a;
    --bg-surface: #111827;
    --bg-card: #1a2235;
    --border: #2a3654;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --leader: #f59e0b;
    --leader-glow: #f59e0b44;
    --follower: #06b6d4;
    --follower-glow: #06b6d444;
    --candidate: #f97316;
    --candidate-glow: #f9731644;
    --accent: #8b5cf6;
    --success: #10b981;
    --danger: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 999;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  }

  header {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--bg-surface);
  }

  header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  header h1 span { color: var(--accent); }

  .header-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .config-bar {
    padding: 10px 24px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .config-bar label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .config-bar input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 8px;
    border-radius: 6px;
    min-width: 0;
    flex: 1;
    max-width: 320px;
  }

  .config-bar input:focus { outline: none; border-color: var(--accent); }

  .config-bar button, .btn-primary, .btn-secondary {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { filter: brightness(1.2); }
  .btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border) !important; }
  .btn-secondary:hover { border-color: var(--accent) !important; }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 0;
    min-height: calc(100vh - 100px);
  }

  .cluster-view {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 30% 40%, #8b5cf610 0%, transparent 60%),
      radial-gradient(ellipse at 70% 60%, #06b6d408 0%, transparent 60%),
      var(--bg-deep);
  }

  canvas#cluster-canvas { width: 100%; height: 100%; }

  .sidebar {
    background: var(--bg-surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
  }

  .sidebar-section {
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
  }

  .sidebar-section h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  /* Node cards */
  .node-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    transition: border-color 0.3s;
  }

  .node-card.leader { border-color: var(--leader); }
  .node-card.follower { border-color: var(--follower); }
  .node-card.candidate { border-color: var(--candidate); }
  .node-card.offline { opacity: 0.4; }

  .node-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .node-card-header .node-name {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 13px;
  }

  .node-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .node-badge.leader { background: var(--leader-glow); color: var(--leader); }
  .node-badge.follower { background: var(--follower-glow); color: var(--follower); }
  .node-badge.candidate { background: var(--candidate-glow); color: var(--candidate); }
  .node-badge.offline { background: #ef444422; color: var(--danger); }

  .node-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 8px;
  }

  .node-stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    display: flex;
    justify-content: space-between;
    min-width: 0;
  }

  .node-stat .label { color: var(--text-dim); }
  .node-stat .value { color: var(--text); font-weight: 500; }

  /* Data volume */
  .volume-grid { display: grid; gap: 6px; }

  .volume-row {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }

  .volume-row .vol-label { color: var(--text-dim); }
  .volume-row .vol-value { color: var(--text); font-weight: 500; }

  .volume-bar-wrap {
    height: 5px;
    background: var(--bg-deep);
    border-radius: 3px;
    overflow: hidden;
  }

  .volume-bar {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .volume-bar.sent { background: var(--accent); }
  .volume-bar.recv { background: var(--follower); }

  .volume-total {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  .volume-total-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .volume-peer-section {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  /* Put form */
  .put-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .put-form input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 8px;
    border-radius: 6px;
    min-width: 0;
  }

  .put-form input:focus { outline: none; border-color: var(--accent); }

  .put-form button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    background: var(--success);
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: filter 0.2s;
    grid-column: 1 / -1;
  }

  .put-form button:hover { filter: brightness(1.2); }

  /* Throughput */
  .throughput-bars {
    display: flex;
    align-items: flex-end;
    gap: 1px;
    height: 50px;
  }

  .throughput-bar {
    flex: 1;
    background: var(--accent);
    border-radius: 1px 1px 0 0;
    min-height: 1px;
    transition: height 0.3s ease;
    opacity: 0.7;
  }

  /* Message log */
  .msg-log {
    max-height: 200px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }

  .msg-log::-webkit-scrollbar { width: 3px; }
  .msg-log::-webkit-scrollbar-track { background: transparent; }
  .msg-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-entry {
    padding: 3px 0;
    display: flex;
    gap: 6px;
    align-items: center;
    opacity: 0;
    animation: msg-fade-in 0.3s ease forwards;
  }

  @keyframes msg-fade-in {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .msg-entry .msg-time { color: var(--text-dim); flex-shrink: 0; }
  .msg-entry .msg-type { font-weight: 600; flex-shrink: 0; }
  .msg-entry .msg-detail { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg-type.heartbeat { color: #06b6d4; }
  .msg-type.append { color: #8b5cf6; }
  .msg-type.vote { color: #f59e0b; }
  .msg-type.proposal { color: #10b981; }

  .empty-state {
    color: var(--text-dim);
    font-size: 11px;
    font-style: italic;
    text-align: center;
    padding: 12px;
  }

  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
    .cluster-view { min-height: 400px; }
  }
</style>
</head>
<body>
<div class="grain"></div>

<header>
  <h1><span>raft</span>::dashboard</h1>
  <div class="header-controls">
    <div class="status-dot" id="status-dot"></div>
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim)" id="poll-status">connecting...</span>
  </div>
</header>

<div class="config-bar">
  <label>nodes</label>
  <input type="text" id="nodes-input" placeholder="host:9080,host:9081,host:9082" />
  <button class="btn-primary" onclick="applyConfig()">Connect</button>
  <label>poll</label>
  <button class="btn-secondary" onclick="setPoll(500)">500ms</button>
  <button class="btn-secondary" onclick="setPoll(1000)">1s</button>
  <button class="btn-secondary" onclick="setPoll(2000)">2s</button>
</div>

<div class="main-grid">
  <div class="cluster-view">
    <canvas id="cluster-canvas"></canvas>
  </div>
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>Cluster Nodes</h3>
      <div id="node-cards" class="empty-state">Configure node endpoints above</div>
    </div>
    <div class="sidebar-section">
      <h3>Data Volume</h3>
      <div id="data-volume" class="empty-state">Waiting for data...</div>
    </div>
    <div class="sidebar-section">
      <h3>Send Proposal</h3>
      <div class="put-form">
        <input type="text" id="put-key" placeholder="key" />
        <input type="text" id="put-val" placeholder="value" />
        <button onclick="sendPut()">PUT</button>
      </div>
    </div>
    <div class="sidebar-section">
      <h3>Message Throughput</h3>
      <div class="throughput-bars" id="throughput-bars"></div>
    </div>
    <div class="sidebar-section">
      <h3>Message Log</h3>
      <div class="msg-log" id="msg-log">
        <div class="empty-state">Waiting for data...</div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// STATE
// ============================================================
let nodeEndpoints = [];
let nodeData = {};
let prevData = {};
let pollInterval = 1000;
let pollTimer = null;
let particles = [];
let msgLog = [];
let throughputHistory = new Array(60).fill(0);
let canvas, ctx;

// ============================================================
// HELPERS
// ============================================================
function formatBytes(b) {
  if (b === 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.min(Math.floor(Math.log(b) / Math.log(1024)), units.length - 1);
  const val = b / Math.pow(1024, i);
  return val.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

function stateInfo(d) {
  const online = d._online;
  const state = online ? (d.state || 'unknown').toLowerCase() : 'offline';
  const stateClass = state === 'stateleader' ? 'leader'
    : state === 'statefollower' ? 'follower'
    : state === 'statecandidate' ? 'candidate' : 'offline';
  const stateLabel = state === 'stateleader' ? 'Leader'
    : state === 'statefollower' ? 'Follower'
    : state === 'statecandidate' ? 'Candidate' : 'Offline';
  return { online, stateClass, stateLabel };
}

// ============================================================
// CONFIG
// ============================================================
function applyConfig() {
  const input = document.getElementById('nodes-input').value.trim();
  if (!input) return;
  nodeEndpoints = input.split(',').map(s => {
    s = s.trim();
    if (!s.startsWith('http')) s = 'http://' + s;
    return s;
  });
  nodeData = {};
  prevData = {};
  startPolling();
}

function setPoll(ms) {
  pollInterval = ms;
  if (pollTimer) startPolling();
}

// ============================================================
// POLLING
// ============================================================
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  fetchAll();
  pollTimer = setInterval(fetchAll, pollInterval);
}

async function fetchAll() {
  const results = await Promise.allSettled(
    nodeEndpoints.map(ep =>
      fetch(ep + '/api/stats', { signal: AbortSignal.timeout(3000) }).then(r => r.json())
    )
  );

  let anyOk = false;
  results.forEach((r, i) => {
    const key = 'node-' + i;
    if (r.status === 'fulfilled') {
      anyOk = true;
      prevData[key] = nodeData[key] || null;
      nodeData[key] = r.value;
      nodeData[key]._endpoint = nodeEndpoints[i];
      nodeData[key]._online = true;
    } else {
      if (nodeData[key]) nodeData[key]._online = false;
      else nodeData[key] = { id: i + 1, _endpoint: nodeEndpoints[i], _online: false };
    }
  });

  const dot = document.getElementById('status-dot');
  const status = document.getElementById('poll-status');
  dot.style.background = anyOk ? 'var(--success)' : 'var(--danger)';
  status.textContent = anyOk ? 'live' : 'disconnected';

  computeDiffs();
  renderNodeCards();
  renderDataVolume();
  updateThroughput();
}

function computeDiffs() {
  Object.keys(nodeData).forEach(key => {
    const cur = nodeData[key], prev = prevData[key];
    if (!cur || !prev || !cur.messages || !prev.messages) return;
    const curSent = cur.messages.peerSent || {}, prevSent = prev.messages.peerSent || {};
    Object.keys(curSent).forEach(peerId => {
      const curTypes = curSent[peerId] || {}, prevTypes = prevSent[peerId] || {};
      Object.keys(curTypes).forEach(msgType => {
        const diff = (curTypes[msgType] || 0) - (prevTypes[msgType] || 0);
        if (diff > 0) {
          spawnParticles(cur.id, parseInt(peerId), msgType, diff);
          addLogEntry(cur.id, parseInt(peerId), msgType, diff);
        }
      });
    });
  });
}

// ============================================================
// RENDERING - NODE CARDS
// ============================================================
function renderNodeCards() {
  const container = document.getElementById('node-cards');
  const keys = Object.keys(nodeData).sort();
  if (keys.length === 0) {
    container.innerHTML = '<div class="empty-state">Configure node endpoints above</div>';
    return;
  }

  container.innerHTML = keys.map(key => {
    const d = nodeData[key];
    const { online, stateClass, stateLabel } = stateInfo(d);
    const m = d.messages || {};

    return `
      <div class="node-card ${stateClass}">
        <div class="node-card-header">
          <span class="node-name">Node ${d.id || '?'}</span>
          <span class="node-badge ${stateClass}">${stateLabel}</span>
        </div>
        ${online ? `
        <div class="node-stats">
          <div class="node-stat"><span class="label">term</span><span class="value">${d.term || 0}</span></div>
          <div class="node-stat"><span class="label">leader</span><span class="value">${d.leader || '-'}</span></div>
          <div class="node-stat"><span class="label">commit</span><span class="value">${d.commit || 0}</span></div>
          <div class="node-stat"><span class="label">applied</span><span class="value">${d.applied || 0}</span></div>
          <div class="node-stat"><span class="label">kv count</span><span class="value">${d.kvCount || 0}</span></div>
          <div class="node-stat"><span class="label">msgs</span><span class="value">${m.totalSent || 0}</span></div>
          <div class="node-stat"><span class="label">data out</span><span class="value">${formatBytes(m.bytesSent || 0)}</span></div>
          <div class="node-stat"><span class="label">data in</span><span class="value">${formatBytes(m.bytesReceived || 0)}</span></div>
        </div>` : '<div class="node-stats"><div class="node-stat"><span class="label">unreachable</span></div></div>'}
      </div>
    `;
  }).join('');
}

// ============================================================
// DATA VOLUME
// ============================================================
function renderDataVolume() {
  const container = document.getElementById('data-volume');
  const keys = Object.keys(nodeData).sort();
  const online = keys.filter(k => nodeData[k]?._online);

  if (online.length === 0) {
    container.innerHTML = '<div class="empty-state">Waiting for data...</div>';
    return;
  }

  let totalOut = 0, totalIn = 0;
  online.forEach(k => {
    const m = nodeData[k]?.messages;
    if (m) { totalOut += m.bytesSent || 0; totalIn += m.bytesReceived || 0; }
  });

  // Per-node totals
  const perNode = [];
  online.forEach(k => {
    const d = nodeData[k];
    const m = d?.messages;
    if (!m) return;
    perNode.push({
      id: d.id,
      sent: m.bytesSent || 0,
      recv: m.bytesReceived || 0,
      total: (m.bytesSent || 0) + (m.bytesReceived || 0),
    });
  });
  perNode.sort((a, b) => b.total - a.total);
  const maxNode = Math.max(1, ...perNode.map(n => n.total));

  // Per-flow breakdown
  const flows = {};
  online.forEach(k => {
    const d = nodeData[k], m = d?.messages;
    if (!m) return;
    const pbs = m.peerBytesSent || {};
    Object.keys(pbs).forEach(toId => {
      const key = d.id + ' \u2192 ' + toId;
      flows[key] = (flows[key] || 0) + pbs[toId];
    });
  });
  const flowEntries = Object.entries(flows).sort((a, b) => b[1] - a[1]);
  const maxFlow = Math.max(1, ...flowEntries.map(e => e[1]));

  let html = `
    <div class="volume-total">${formatBytes(totalOut + totalIn)}</div>
    <div class="volume-total-label">total cluster traffic</div>
    <div class="volume-grid">
      <div class="volume-row"><span class="vol-label">cluster sent</span><span class="vol-value">${formatBytes(totalOut)}</span></div>
      <div class="volume-bar-wrap"><div class="volume-bar sent" style="width:${totalOut / Math.max(1, totalOut + totalIn) * 100}%"></div></div>
      <div class="volume-row"><span class="vol-label">cluster recv</span><span class="vol-value">${formatBytes(totalIn)}</span></div>
      <div class="volume-bar-wrap"><div class="volume-bar recv" style="width:${totalIn / Math.max(1, totalOut + totalIn) * 100}%"></div></div>
    </div>
    <div class="volume-peer-section">
  `;

  // Per-node bars
  perNode.forEach(n => {
    const pct = (n.total / maxNode) * 100;
    html += `
      <div class="volume-row"><span class="vol-label">node ${n.id}</span><span class="vol-value">${formatBytes(n.sent)} out / ${formatBytes(n.recv)} in</span></div>
      <div class="volume-bar-wrap"><div class="volume-bar sent" style="width:${pct}%"></div></div>
    `;
  });

  // Per-flow
  if (flowEntries.length > 0) {
    html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">';
    html += '<div class="volume-row" style="margin-bottom:6px"><span class="vol-label" style="font-size:9px;text-transform:uppercase;letter-spacing:0.5px">per-flow breakdown</span></div>';
    flowEntries.forEach(([flow, bytes]) => {
      html += `
        <div class="volume-row"><span class="vol-label">${flow}</span><span class="vol-value">${formatBytes(bytes)}</span></div>
        <div class="volume-bar-wrap"><div class="volume-bar sent" style="width:${(bytes / maxFlow) * 100}%"></div></div>
      `;
    });
    html += '</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

// ============================================================
// THROUGHPUT
// ============================================================
function updateThroughput() {
  let totalNew = 0;
  Object.keys(nodeData).forEach(key => {
    const cur = nodeData[key], prev = prevData[key];
    if (cur?.messages && prev?.messages)
      totalNew += (cur.messages.totalSent || 0) - (prev.messages.totalSent || 0);
  });
  throughputHistory.push(totalNew);
  if (throughputHistory.length > 60) throughputHistory.shift();

  const container = document.getElementById('throughput-bars');
  const max = Math.max(1, ...throughputHistory);
  container.innerHTML = throughputHistory.map(v => {
    const h = Math.max(1, (v / max) * 48);
    return `<div class="throughput-bar" style="height:${h}px"></div>`;
  }).join('');
}

// ============================================================
// MESSAGE LOG
// ============================================================
function addLogEntry(from, to, type_, count) {
  const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const typeClass = type_.includes('Heartbeat') ? 'heartbeat'
    : type_.includes('App') ? 'append'
    : type_.includes('Vote') ? 'vote' : 'proposal';
  const shortType = type_.replace('Msg', '');

  msgLog.unshift({ time, from, to, type: shortType, typeClass, count });
  if (msgLog.length > 100) msgLog.pop();
  renderLog();
}

function renderLog() {
  const container = document.getElementById('msg-log');
  if (msgLog.length === 0) {
    container.innerHTML = '<div class="empty-state">Waiting for data...</div>';
    return;
  }
  container.innerHTML = msgLog.slice(0, 40).map(e => `
    <div class="msg-entry">
      <span class="msg-time">${e.time}</span>
      <span class="msg-type ${e.typeClass}">${e.type}</span>
      <span class="msg-detail">${e.from}\u2192${e.to} x${e.count}</span>
    </div>
  `).join('');
}

// ============================================================
// CANVAS - CLUSTER VISUALIZATION
// ============================================================
function initCanvas() {
  canvas = document.getElementById('cluster-canvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  animate();
}

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(devicePixelRatio, devicePixelRatio);
}

function getNodePositions() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const count = Object.keys(nodeData).length || 3;
  const radius = Math.min(cx, cy) * 0.55;
  const positions = {};
  for (let i = 0; i < count; i++) {
    const angle = -Math.PI / 2 + (2 * Math.PI * i) / count;
    positions['node-' + i] = { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) };
  }
  return positions;
}

function spawnParticles(fromId, toId, msgType, count) {
  const n = Math.min(count, 8);
  for (let i = 0; i < n; i++) {
    particles.push({
      fromKey: 'node-' + (fromId - 1),
      toKey: 'node-' + (toId - 1),
      t: -i * 0.08,
      speed: 0.015 + Math.random() * 0.01,
      type: msgType,
    });
  }
}

function msgColor(type) {
  if (type.includes('Heartbeat')) return '#06b6d4';
  if (type.includes('App')) return '#8b5cf6';
  if (type.includes('Vote')) return '#f59e0b';
  return '#10b981';
}

function animate() {
  const rect = canvas.parentElement.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);
  const pos = getNodePositions();
  const keys = Object.keys(pos);

  // Draw connections — show byte volume on the line
  for (let i = 0; i < keys.length; i++) {
    for (let j = i + 1; j < keys.length; j++) {
      const a = pos[keys[i]], b = pos[keys[j]];

      // Calculate total bytes between these two nodes
      let flowBytes = 0;
      const idA = (nodeData[keys[i]]?.id || 0), idB = (nodeData[keys[j]]?.id || 0);
      [keys[i], keys[j]].forEach(k => {
        const m = nodeData[k]?.messages;
        if (!m) return;
        const pbs = m.peerBytesSent || {};
        const target = k === keys[i] ? String(idB) : String(idA);
        flowBytes += pbs[target] || 0;
      });

      // Line thickness based on volume
      const thickness = flowBytes > 0 ? Math.min(6, 1 + Math.log10(flowBytes + 1) * 0.5) : 1;

      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = flowBytes > 0 ? '#2a365466' : '#2a365422';
      ctx.lineWidth = thickness;
      ctx.stroke();

      // Show byte label on the connection
      if (flowBytes > 0) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        ctx.fillStyle = '#64748b';
        ctx.font = "9px 'JetBrains Mono', monospace";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(formatBytes(flowBytes), mx, my - 8);
      }
    }
  }

  // Animate particles
  particles = particles.filter(p => {
    p.t += p.speed;
    if (p.t > 1) return false;
    if (p.t < 0) return true;
    const from = pos[p.fromKey], to = pos[p.toKey];
    if (!from || !to) return false;
    const x = from.x + (to.x - from.x) * p.t;
    const y = from.y + (to.y - from.y) * p.t;
    const c = msgColor(p.type);
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = c;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.fillStyle = c + '33';
    ctx.fill();
    return true;
  });

  // Draw nodes
  keys.forEach(key => {
    const p = pos[key];
    const d = nodeData[key];
    const si = d ? stateInfo(d) : { online: false, stateClass: 'offline', stateLabel: 'Offline' };
    const isLeader = si.stateClass === 'leader';
    const color = isLeader ? '#f59e0b'
      : si.stateClass === 'candidate' ? '#f97316'
      : si.online ? '#06b6d4' : '#ef4444';

    // Leader glow
    if (isLeader) {
      const grad = ctx.createRadialGradient(p.x, p.y, 20, p.x, p.y, 55);
      grad.addColorStop(0, '#f59e0b22');
      grad.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(p.x, p.y, 55, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // Circle
    ctx.beginPath();
    ctx.arc(p.x, p.y, 28, 0, Math.PI * 2);
    ctx.fillStyle = '#111827';
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = isLeader ? 3 : 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(p.x, p.y, 24, 0, Math.PI * 2);
    ctx.fillStyle = color + '18';
    ctx.fill();

    // ID
    ctx.fillStyle = color;
    ctx.font = "bold 16px 'JetBrains Mono', monospace";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(d?.id || '?', p.x, p.y);

    // Label + data volume below node
    const label = si.stateLabel.toUpperCase();
    ctx.fillStyle = color + 'aa';
    ctx.font = "500 10px 'JetBrains Mono', monospace";
    ctx.fillText(label, p.x, p.y + 42);

    // Show data sent below the label
    if (si.online && d?.messages) {
      ctx.fillStyle = '#64748bcc';
      ctx.font = "9px 'JetBrains Mono', monospace";
      ctx.fillText(formatBytes(d.messages.bytesSent || 0) + ' sent', p.x, p.y + 54);
    }
  });

  // Legend
  const legendItems = [
    { color: '#8b5cf6', label: 'Append' },
    { color: '#06b6d4', label: 'Heartbeat' },
    { color: '#f59e0b', label: 'Vote' },
    { color: '#10b981', label: 'Other' },
  ];
  ctx.font = "10px 'JetBrains Mono', monospace";
  ctx.textAlign = 'left';
  legendItems.forEach((item, i) => {
    const x = 16, y = 16 + i * 16;
    ctx.beginPath();
    ctx.arc(x + 4, y + 1, 3, 0, Math.PI * 2);
    ctx.fillStyle = item.color;
    ctx.fill();
    ctx.fillStyle = '#64748b';
    ctx.fillText(item.label, x + 12, y + 4);
  });

  requestAnimationFrame(animate);
}

// ============================================================
// SEND PUT
// ============================================================
async function sendPut() {
  const key = document.getElementById('put-key').value.trim();
  const val = document.getElementById('put-val').value.trim();
  if (!key || !val || !nodeEndpoints[0]) return;
  try {
    await fetch(nodeEndpoints[0] + '/' + encodeURIComponent(key), { method: 'PUT', body: val });
    addLogEntry(0, 0, 'Proposal', 1);
    document.getElementById('put-key').value = '';
    document.getElementById('put-val').value = '';
  } catch (e) { console.error('PUT failed:', e); }
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  initCanvas();
  const host = window.location.hostname || 'localhost';
  const port = window.location.port;
  if (port) {
    const p = parseInt(port);
    document.getElementById('nodes-input').value = [p, p+1, p+2].map(pp => host+':'+pp).join(',');
  } else {
    document.getElementById('nodes-input').value = 'localhost:9080,localhost:9081,localhost:9082';
  }
});
</script>
